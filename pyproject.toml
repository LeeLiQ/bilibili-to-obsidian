[project]
name = "bili-triage"
version = "0.1.0"
description = "B 站技术视频分诊：URL → 证据面板（Obsidian）"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2025.1.1",
    "numpy>=1.26",
    "pillow>=10.1",
    "opencc-python-reimplemented>=0.1.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Apple Silicon（主力机）：mlx-whisper
mac = ["mlx-whisper>=0.4"]
# 其他平台的本地 ASR（CPU / CUDA）。用云端 ASR 时可不装。
local-asr = ["faster-whisper>=1.0"]

[project.scripts]
bili-triage = "bili_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bili_triage"]
